services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orderguard
      POSTGRES_USER: orderguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "5432:5432"
    volumes:
      - orderguard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderguard -d orderguard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orderguard-postgres:
