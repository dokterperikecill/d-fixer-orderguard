services:
  - type: web
    name: dfixer-orderguard
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ORDERGUARD_BOOTSTRAP_USERNAME
        sync: false
      - key: ORDERGUARD_BOOTSTRAP_NAME
        sync: false
      - key: ORDERGUARD_BOOTSTRAP_PASSWORD
        sync: false
      - key: TIKTOK_APP_KEY
        sync: false
      - key: TIKTOK_APP_SECRET
        sync: false
      - key: TIKTOK_REDIRECT_URI
        sync: false
      - key: ORDERGUARD_TOKEN_ENCRYPTION_KEY
        sync: false
